<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Radiant Ayurveda{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --green-900: #1A2720;
      --green-800: #273B30;
      --green-600: #3E5A4B;
      --green-300: #8FB09C;
      --green-100: #E3EAE6;
      --mist: #F0F3F1;
      --ink: #111827;
      --muted: #6B7280;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--ink);
      background: var(--green-900);
      overflow-x: hidden;
    }

    /* ---------- 3D scene behind the page ---------- */
    .scene {
      position: fixed; inset: 0;
      perspective: 1400px;
      background:
        radial-gradient(1200px 700px at 15% 10%, rgba(143,176,156,.28), transparent 60%),
        radial-gradient(900px 600px at 90% 90%, rgba(62,90,75,.55), transparent 60%),
        linear-gradient(160deg, #22332A 0%, #1A2720 55%, #111B15 100%);
      overflow: hidden;
    }
    .world {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      transform: rotateX(0deg) rotateY(0deg);
      transition: transform .6s cubic-bezier(.2,.7,.2,1);
    }
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(40px);
      background: radial-gradient(circle, rgba(143,176,156,.55), rgba(143,176,156,0) 70%);
      animation: orbFloat 14s ease-in-out infinite;
    }
    .orb.o1 { width: 420px; height: 420px; left: -120px; top: 8%; }
    .orb.o2 { width: 340px; height: 340px; right: -100px; top: 55%; animation-delay: -5s; }
    .orb.o3 { width: 260px; height: 260px; left: 40%; bottom: -80px; animation-delay: -9s; }

    .ring {
      position: absolute; left: 50%; top: 46%;
      border-radius: 50%;
      border: 1px dashed rgba(143,176,156,.30);
      transform-style: preserve-3d;
      animation: ringSpin 28s linear infinite;
    }
    .ring.r1 { width: 520px; height: 520px; margin: -260px 0 0 -260px; }
    .ring.r2 { width: 700px; height: 700px; margin: -350px 0 0 -350px; border-style: solid; border-color: rgba(143,176,156,.12); animation-duration: 40s; animation-direction: reverse; }

    .leaf {
      position: absolute;
      width: 84px; height: 84px;
      border-radius: 0 50% 0 50%;
      background: linear-gradient(135deg, rgba(227,234,230,.35), rgba(143,176,156,.10));
      border: 1px solid rgba(227,234,230,.28);
      box-shadow: inset 0 0 22px rgba(255,255,255,.08), 0 0 30px rgba(143,176,156,.18);
      transform-style: preserve-3d;
      animation: leafSpin 16s linear infinite;
    }
    .leaf.l1 { left: 8%;  top: 18%; width: 96px;  height: 96px;  animation-duration: 18s; }
    .leaf.l2 { left: 22%; top: 72%; width: 60px;  height: 60px;  animation-duration: 12s; animation-delay: -4s; }
    .leaf.l3 { right: 10%; top: 14%; width: 74px; height: 74px;  animation-duration: 14s; animation-delay: -7s; }
    .leaf.l4 { right: 18%; top: 66%; width: 110px; height: 110px; animation-duration: 22s; animation-delay: -2s; }
    .leaf.l5 { left: 46%; top: 8%;  width: 46px;  height: 46px;  animation-duration: 10s; animation-delay: -1s; }

    .cube {
      --s: 110px;
      position: absolute;
      width: var(--s); height: var(--s);
      transform-style: preserve-3d;
      animation: cubeSpin 20s linear infinite;
    }
    .cube.c1 { left: 4%; bottom: 14%; }
    .cube.c2 { --s: 140px; right: 6%; bottom: 22%; animation-duration: 26s; animation-direction: reverse; }
    .cube i {
      position: absolute; inset: 0;
      border: 1px solid rgba(227,234,230,.35);
      background: linear-gradient(135deg, rgba(143,176,156,.22), rgba(39,59,48,.25));
    }
    .cube i:nth-child(1) { transform: translateZ(calc(var(--s) / 2)); }
    .cube i:nth-child(2) { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
    .cube i:nth-child(3) { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
    .cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
    .cube i:nth-child(5) { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
    .cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }

    .floor {
      position: absolute; left: -30%; right: -30%; bottom: -10%; height: 70%;
      background-image:
        linear-gradient(rgba(143,176,156,.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(143,176,156,.22) 1px, transparent 1px);
      background-size: 72px 72px;
      transform: rotateX(72deg);
      transform-origin: 50% 100%;
      -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 75%);
              mask-image: linear-gradient(to top, #000 10%, transparent 75%);
      animation: gridMove 9s linear infinite;
    }

    /* ---------- Page content ---------- */
    .page {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 20px;
      gap: 26px;
    }
    .brand { text-align: center; }
    .mark {
      width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 14px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, rgba(255,255,255,.22), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 16px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3);
      color: var(--green-100); font-size: 26px;
      animation: markFloat 6s ease-in-out infinite;
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 60px);
      font-weight: 800;
      letter-spacing: .26em;
      padding-left: .26em; /* balance the trailing letter-spacing */
      text-transform: uppercase;
      background: linear-gradient(100deg, #ffffff 0%, #CFE3D6 35%, #ffffff 50%, #8FB09C 75%, #ffffff 100%);
      background-size: 240% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,.45));
      animation: shine 5s linear infinite;
    }
    .tag {
      margin-top: 10px;
      font-size: 13px; font-weight: 600;
      letter-spacing: .42em; text-transform: uppercase;
      color: var(--green-100);
    }
    .tag span { opacity: .6; }

    .card {
      width: min(420px, 92vw);
      background: rgba(255,255,255,.97);
      border-radius: 22px;
      padding: 36px 34px 30px;
      box-shadow: 0 40px 90px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.4);
      animation: cardIn .9s cubic-bezier(.2,.7,.2,1) both;
    }
    .card.center { text-align: center; }
    .kicker {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
      color: var(--green-800); background: var(--mist); border: 1px solid var(--green-100);
      padding: 6px 10px; border-radius: 999px;
    }
    .card h2 { margin: 16px 0 4px; font-size: 24px; font-weight: 800; color: var(--ink); }
    .card p.sub { margin: 0 0 24px; font-size: 14px; color: var(--muted); }
    .done {
      width: 64px; height: 64px; margin: 0 auto 6px;
      display: grid; place-items: center; border-radius: 50%;
      background: var(--mist); color: var(--green-800); font-size: 24px;
      border: 1px solid var(--green-100);
    }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 8px; }
    .input { position: relative; }
    .input > i.lead {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: #9CA3AF; font-size: 14px; pointer-events: none; transition: color .2s; z-index: 1;
    }
    .input input, .input select {
      width: 100%; height: 48px;
      padding: 0 46px 0 42px;
      border: 1px solid #E5E7EB; border-radius: 12px; background-color: #F8F9FA;
      font: inherit; font-size: 15px; color: var(--ink);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background-color .2s;
    }
    .input select {
      appearance: none; -webkit-appearance: none;
      padding-right: 40px; cursor: pointer;
      background-image:
        linear-gradient(45deg, transparent 50%, #9CA3AF 50%),
        linear-gradient(135deg, #9CA3AF 50%, transparent 50%);
      background-position: calc(100% - 20px) 55%, calc(100% - 15px) 55%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .input input::placeholder { color: #9CA3AF; }
    .input input:focus, .input select:focus {
      border-color: var(--green-800); background-color: #fff; box-shadow: 0 0 0 4px rgba(39,59,48,.12);
    }
    .input:focus-within > i.lead { color: var(--green-800); }
    .toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; border: 0; border-radius: 10px;
      background: transparent; color: #9CA3AF; cursor: pointer;
    }
    .toggle:hover { color: var(--green-800); background: var(--mist); }
    .hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .hint ul { margin: 4px 0 0; padding-left: 18px; }
    .field-error { margin: 6px 0 0; font-size: 12px; color: #B91C1C; }

    .btn {
      width: 100%; height: 50px; margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      border: 0; border-radius: 12px; cursor: pointer; text-decoration: none;
      background: linear-gradient(180deg, #2F4539 0%, var(--green-800) 100%);
      color: #fff; font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .02em;
      box-shadow: 0 14px 28px rgba(39,59,48,.35), inset 0 1px 0 rgba(255,255,255,.12);
      transition: transform .15s, background .2s;
    }
    .btn:hover { background: linear-gradient(180deg, var(--green-800) 0%, var(--green-900) 100%); }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn:focus-visible, .toggle:focus-visible, .foot a:focus-visible, .input select:focus-visible {
      outline: 3px solid rgba(143,176,156,.6); outline-offset: 2px;
    }

    .alert {
      display: flex; align-items: flex-start; gap: 10px;
      background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA;
      border-radius: 12px; padding: 11px 14px; font-size: 14px; margin-bottom: 16px;
    }
    .alert i { margin-top: 2px; }

    .foot {
      margin-top: 22px; padding-top: 18px;
      border-top: 1px solid var(--mist);
      text-align: center; font-size: 14px; color: var(--muted);
    }
    .foot a {
      color: var(--green-800); font-weight: 700; text-decoration: none;
      border-bottom: 1px solid rgba(39,59,48,.25);
    }
    .foot a:hover { border-bottom-color: var(--green-800); }

    .copyright { margin: 0; font-size: 12px; letter-spacing: .04em; color: rgba(227,234,230,.6); }

    /* ---------- Animations ---------- */
    @keyframes leafSpin {
      0%   { transform: translate3d(0,0,0) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      50%  { transform: translate3d(0,-26px,120px) rotateX(180deg) rotateY(160deg) rotateZ(25deg); }
      100% { transform: translate3d(0,0,0) rotateX(360deg) rotateY(360deg) rotateZ(0deg); }
    }
    @keyframes cubeSpin {
      0%   { transform: rotateX(0deg) rotateY(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg); }
    }
    @keyframes ringSpin {
      0%   { transform: rotateX(70deg) rotateZ(0deg); }
      100% { transform: rotateX(70deg) rotateZ(360deg); }
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate3d(0,0,0) scale(1); }
      50%      { transform: translate3d(30px,-40px,0) scale(1.08); }
    }
    @keyframes gridMove {
      0%   { background-position: 0 0, 0 0; }
      100% { background-position: 0 72px, 0 0; }
    }
    @keyframes shine {
      0%   { background-position: 0% 50%; }
      100% { background-position: 240% 50%; }
    }
    @keyframes markFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }

    @media (max-width: 560px) {
      .card { padding: 28px 22px 24px; }
      .tag { font-size: 11px; letter-spacing: .2em; }
      .leaf.l4, .cube.c2 { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- 3D animated background -->
  <div class="scene" aria-hidden="true">
    <div class="world">
      <div class="orb o1"></div>
      <div class="orb o2"></div>
      <div class="orb o3"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="leaf l1"></div>
      <div class="leaf l2"></div>
      <div class="leaf l3"></div>
      <div class="leaf l4"></div>
      <div class="leaf l5"></div>
      <div class="cube c1"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="cube c2"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="floor"></div>
    </div>
  </div>

  <main class="page">

    <div class="brand">
      <div class="mark"><i class="fa-solid fa-leaf"></i></div>
      <h1>Radiant</h1>
      <div class="tag">Ayurveda</div>
    </div>

    <section class="card {% block card_class %}{% endblock %}">
      {% block card %}{% endblock %}
    </section>

    <p class="copyright">&copy; Radiant Ayurveda</p>
  </main>

  <script>
    (function () {
      // The 3D scene follows the mouse gently (skipped when motion is reduced).
      var scene = document.querySelector('.scene');
      var world = scene && scene.querySelector('.world');
      if (world && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.addEventListener('pointermove', function (e) {
          var x = e.clientX / window.innerWidth - 0.5;
          var y = e.clientY / window.innerHeight - 0.5;
          world.style.transform = 'rotateX(' + (-y * 8) + 'deg) rotateY(' + (x * 10) + 'deg)';
        });
      }

      // Show or hide a password box. Each eye button names the box it controls.
      document.querySelectorAll('.toggle[data-target]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var input = document.getElementById(btn.getAttribute('data-target'));
          if (!input) return;
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
          btn.innerHTML = show ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
        });
      });

      // Start on the first empty box of the form.
      var first = document.querySelector('.card form input:not([type="hidden"]):not([type="password"]), .card form select');
      if (first && !first.value) { first.focus(); }
    })();
  </script>
</body>
</html>
