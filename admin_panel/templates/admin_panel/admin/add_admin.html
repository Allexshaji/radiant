<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Admin - Radiant Ayurveda</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-[#F8F9FA] min-h-screen flex text-gray-800 relative">

    <!-- Mobile Sidebar Overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-gray-900/50 z-20 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

    <!-- Sidebar Navigation -->
    {% include "admin_panel/components/sidebar.html" %}


    <!-- Main Page Work Area -->
    <div class="flex-1 flex flex-col min-h-screen min-w-0">
        
        <!-- Header -->
        <header class="px-4 sm:px-8 py-5 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-[#F8F9FA] z-10 sticky top-0 md:static">
            
            <div class="flex items-center gap-3">
                <!-- Hamburger Menu Button (Mobile Only) -->
                <button onclick="toggleSidebar()" class="md:hidden text-gray-700 p-2 -ml-2 rounded-lg hover:bg-gray-200 transition-colors">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>

                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-gray-950 tracking-tight">Create Admin</h1>
                    <p class="text-xs sm:text-sm text-gray-500 font-medium">Register a new high-level administrator</p>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center">
                <a href="{% url 'all_staff' %}" class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-gray-600 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 shadow-sm transition">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Staff
                </a>
            </div>
        </header>


        <!-- Main Content Area -->
        <main class="flex-1 px-4 sm:px-8 pb-10">
            
            <div class="max-w-3xl mx-auto">

                <!-- Django Messages -->
                {% if messages %}
                    <div class="mb-6 space-y-3">
                        {% for message in messages %}
                            <div class="px-4 py-3 rounded-lg text-sm font-medium border shadow-sm flex items-center gap-3
                                {% if message.tags == 'error' %}
                                    bg-red-50 text-red-700 border-red-100
                                {% else %}
                                    bg-emerald-50 text-emerald-700 border-emerald-100
                                {% endif %}">
                                
                                {% if message.tags == 'error' %}
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                {% else %}
                                    <i class="fa-solid fa-circle-check"></i>
                                {% endif %}
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <!-- Form Card -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sm:p-8">
                    
                    <form method="POST">
                        {% csrf_token %}

                        <!-- Username -->
                        <div class="mb-5">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Username <span class="text-red-500">*</span></label>
                            <input type="text" name="username" required
                                   class="w-full bg-white border border-gray-200 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow"
                                   placeholder="Enter username">
                        </div>

                        <!-- Name Row -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                            <!-- First Name -->
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">First Name <span class="text-red-500">*</span></label>
                                <input type="text" name="first_name" required
                                       class="w-full bg-white border border-gray-200 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow"
                                       placeholder="Enter first name">
                            </div>

                            <!-- Last Name -->
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Last Name</label>
                                <input type="text" name="last_name"
                                       class="w-full bg-white border border-gray-200 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow"
                                       placeholder="Enter last name">
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-5">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                            <input type="email" name="email"
                                   class="w-full bg-white border border-gray-200 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow"
                                   placeholder="admin@example.com">
                        </div>

                        <!-- Password -->
                        <div class="mb-8">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Password <span class="text-red-500">*</span></label>
                            <input type="password" name="password" required
                                   class="w-full bg-white border border-gray-200 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-shadow"
                                   placeholder="Create a strong password">
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-col sm:flex-row gap-3 pt-2 border-t border-gray-100">
                            <button type="submit"
                                    class="w-full sm:w-auto bg-gray-900 hover:bg-gray-800 text-white px-6 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition-colors mt-4">
                                Create Admin Account
                            </button>

                            <a href="{% url 'all_staff' %}"
                               class="w-full sm:w-auto bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 px-6 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition-colors text-center mt-0 sm:mt-4">
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>

            </div>

        </main>
    </div>

    <!-- Script for Mobile Sidebar Toggle -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
            document.body.classList.toggle('overflow-hidden');
        }
    </script>

</body>
</html>
