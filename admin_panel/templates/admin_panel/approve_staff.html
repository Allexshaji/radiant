<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approve Staff - Radiant Ayurveda</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8F9FA; }
    </style>
</head>

<body class="bg-[#F8F9FA] min-h-screen flex text-gray-800 relative">
    {% include "admin_panel/components/sidebar.html" %}
    {% include "admin_panel/components/sidebar_script.html" %}

    <div class="flex-1 min-w-0 px-6 sm:px-10 py-8">
        <h1 class="text-3xl font-bold text-gray-900 tracking-tight mb-2">Approve Staff</h1>
        <p class="text-sm text-gray-500 font-medium mb-8">Choose the staff member's branch and role, then approve the account.</p>

        <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm max-w-xl">
            <form method="post" action="">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="mt-4 bg-[#273B30] hover:bg-[#1A2720] text-white text-sm font-medium px-5 py-2.5 rounded-lg shadow-sm transition">Approve Staff</button>
            </form>
        </div>
    </div>
</body>
</html>
