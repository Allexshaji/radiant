<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Expense</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-[#F8F9FA] min-h-screen flex text-gray-800 relative">

    <!-- Mobile Sidebar Overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-gray-900/50 z-20 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

    <!-- Sidebar Navigation -->
    {% include "admin_panel/components/sidebar.html" %}

    <!-- Main Page Work Area -->
    <div class="flex-1 flex flex-col min-h-screen min-w-0">

        <!-- Header -->
        <header class="px-4 sm:px-8 py-5 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-[#F8F9FA] z-10 sticky top-0 md:static">

            <div class="flex items-center gap-3">
                <!-- Hamburger Menu Button (Mobile Only) -->
                <button onclick="toggleSidebar()" class="md:hidden text-gray-700 p-2 -ml-2 rounded-lg hover:bg-gray-200 transition-colors">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>

                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-gray-950 tracking-tight">Delete Expense</h1>
                    <p class="text-xs sm:text-sm text-gray-500 font-medium">Confirm deletion</p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 px-4 sm:px-8 pb-10 flex items-center justify-center">

            <div class="max-w-md w-full">
                <div class="bg-white border border-gray-100 rounded-xl shadow-sm p-8 text-center">

                    <!-- Warning Icon -->
                    <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i class="fa-solid fa-exclamation-triangle text-red-600 text-2xl"></i>
                    </div>

                    <!-- Message -->
                    <h2 class="text-xl font-bold text-gray-900 mb-2">Delete {{ expense_type.name }}?</h2>
                    <p class="text-gray-600 text-sm mb-6">
                        Staff will no longer see this expense in the dropdown. Expenses already saved in reports keep their names.
                    </p>

                    <!-- Buttons -->
                    <form method="POST" class="flex items-center gap-3">
                        {% csrf_token %}
                        <a href="{% url 'expensetype_list' %}" class="flex-1 px-4 py-2.5 bg-gray-100 text-gray-900 font-semibold rounded-lg hover:bg-gray-200 transition">
                            Cancel
                        </a>
                        <button type="submit" class="flex-1 px-4 py-2.5 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </form>

                </div>
            </div>

        </main>
    </div>

    <!-- Script for Mobile Sidebar Toggle -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');

            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
            document.body.classList.toggle('overflow-hidden');
        }
    </script>

</body>
</html>
