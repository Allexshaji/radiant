<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Leave Status - Radiant Ayurveda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8F9FA; }
    </style>
</head>
<body class="bg-[#F8F9FA] min-h-screen flex text-gray-800 relative">
    {% include "admin_panel/components/sidebar.html" %}
    {% include "admin_panel/components/sidebar_script.html" %}

    <div class="flex-1 min-w-0 px-6 sm:px-10 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Edit Leave Status</h1>
            <p class="text-sm text-gray-500 font-medium mt-2">{{ leave.staff.full_name|default:leave.staff.username }} &middot; {{ leave.leave_type.name }}</p>
        </header>

        <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm max-w-xl">
            <form method="post" action="{% url 'edit_leave' leave.id %}">
                {% csrf_token %}
                <label class="block text-sm font-semibold text-gray-700 mb-2" for="status">Status</label>
                <select id="status" name="status" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm">
                    {% for value, label in status_choices %}
                        <option value="{{ value }}" {% if leave.status == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
                <div class="flex gap-3 mt-6">
                    <button type="submit" class="bg-[#273B30] hover:bg-[#1A2720] text-white text-sm font-medium px-5 py-2.5 rounded-lg shadow-sm transition">Save status</button>
                    <a href="{% url 'all_leave_requests' %}" class="px-5 py-2.5 text-sm font-semibold text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
