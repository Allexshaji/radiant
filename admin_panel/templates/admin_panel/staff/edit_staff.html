<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Staff | Admin Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-[#F8F9FA] min-h-screen flex text-gray-800 relative">

    <!-- Mobile Sidebar Overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-gray-900/50 z-20 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

    <!-- Sidebar Navigation -->
    {% include "admin_panel/components/sidebar.html" %}


    <!-- Main Page Work Area -->
    <div class="flex-1 flex flex-col min-h-screen min-w-0">
        
        <!-- Header -->
        <header class="px-4 sm:px-8 py-5 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-[#F8F9FA] z-10 sticky top-0 md:static">
            
            <div class="flex items-center gap-3">
                <!-- Hamburger Menu Button (Mobile Only) -->
                <button onclick="toggleSidebar()" class="md:hidden text-gray-700 p-2 -ml-2 rounded-lg hover:bg-gray-200 transition-colors">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>

                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-gray-950 tracking-tight">Edit Staff</h1>
                    <p class="text-xs sm:text-sm text-gray-500 font-medium">Update staff information and permissions</p>
                </div>
            </div>

            <!-- Back Action -->
            <div>
                <a href="{% url 'all_staff' %}" class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-50 transition-colors shadow-sm">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                    Back to Staff List
                </a>
            </div>
        </header>


        <!-- Main Grid Work -->
        <main class="flex-1 px-4 sm:px-8 pb-10">

            <div class="max-w-3xl bg-white border border-gray-100 rounded-xl shadow-sm p-6 sm:p-8">

                <form method="POST">

                    {% csrf_token %}

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
                        
                        <!-- Username -->
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Username</label>
                            <input
                                type="text"
                                name="username"
                                value="{{ staff.username }}"
                                required
                                class="w-full bg-[#F8F9FA] border border-gray-200 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-200 focus:border-gray-400 transition-colors shadow-sm"
                            >
                        </div>

                        <!-- First Name -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">First Name</label>
                            <input
                                type="text"
                                name="first_name"
                                value="{{ staff.first_name }}"
                                required
                                class="w-full bg-[#F8F9FA] border border-gray-200 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-200 focus:border-gray-400 transition-colors shadow-sm"
                            >
                        </div>

                        <!-- Last Name -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Last Name</label>
                            <input
                                type="text"
                                name="last_name"
                                value="{{ staff.last_name }}"
                                class="w-full bg-[#F8F9FA] border border-gray-200 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-200 focus:border-gray-400 transition-colors shadow-sm"
                            >
                        </div>

                        <!-- Email -->
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Email</label>
                            <input
                                type="email"
                                name="email"
                                value="{{ staff.email }}"
                                class="w-full bg-[#F8F9FA] border border-gray-200 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-200 focus:border-gray-400 transition-colors shadow-sm"
                            >
                        </div>

                        <!-- Branch -->
                        <div class="sm:col-span-2 relative">
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Branch Assignment</label>
                            <select
                                name="branch"
                                class="w-full appearance-none bg-[#F8F9FA] border border-gray-200 rounded-lg px-4 py-2.5 pr-10 text-sm font-medium text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-200 focus:border-gray-400 transition-colors shadow-sm cursor-pointer">
                                
                                <option value="">No Branch</option>

                                {% for branch in branches %}
                                    <option
                                        value="{{ branch.id }}"
                                        {% if staff.branch_id == branch.id %}selected{% endif %}
                                    >
                                        {{ branch.name }}
                                    </option>
                                {% endfor %}

                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-4 top-[38px] text-[10px] text-gray-400 pointer-events-none"></i>
                        </div>
                    </div>

                    <!-- Permissions & Status (Checkboxes) -->
                    <div class="mb-8 p-4 bg-[#F8F9FA] rounded-lg border border-gray-100 space-y-4">
                        
                        <h4 class="text-sm font-bold text-gray-900 mb-3">Account Status & Permissions</h4>

                        <!-- Approval -->
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <div class="relative flex items-center">
                                <input
                                    type="checkbox"
                                    name="is_approved"
                                    {% if staff.is_approved %}checked{% endif %}
                                    class="w-5 h-5 appearance-none border border-gray-300 rounded bg-white checked:bg-emerald-600 checked:border-emerald-600 focus:ring-2 focus:ring-emerald-200 transition-colors cursor-pointer"
                                >
                                <i class="fa-solid fa-check absolute text-white text-[10px] left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 check-icon pointer-events-none transition-opacity"></i>
                            </div>
                            <div>
                                <span class="text-sm font-semibold text-gray-900 group-hover:text-emerald-700 transition-colors">Approved Status</span>
                                <p class="text-xs text-gray-500">Allow staff member to log in and use the system.</p>
                            </div>
                        </label>

                        <hr class="border-gray-200">

                        <!-- Active -->
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <div class="relative flex items-center">
                                <input
                                    type="checkbox"
                                    name="is_active"
                                    {% if staff.is_active %}checked{% endif %}
                                    class="w-5 h-5 appearance-none border border-gray-300 rounded bg-white checked:bg-emerald-600 checked:border-emerald-600 focus:ring-2 focus:ring-emerald-200 transition-colors cursor-pointer"
                                >
                                <i class="fa-solid fa-check absolute text-white text-[10px] left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 check-icon pointer-events-none transition-opacity"></i>
                            </div>
                            <div>
                                <span class="text-sm font-semibold text-gray-900 group-hover:text-emerald-700 transition-colors">Active Account</span>
                                <p class="text-xs text-gray-500">Keep this account active and visible in the directory.</p>
                            </div>
                        </label>

                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center gap-3 pt-4 border-t border-gray-100">
                        <button
                            type="submit"
                            class="bg-gray-900 hover:bg-gray-800 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition-colors shadow-sm">
                            Save Changes
                        </button>

                        <a
                            href="{% url 'all_staff' %}"
                            class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 px-6 py-2.5 rounded-lg text-sm font-semibold transition-colors shadow-sm">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>

        </main>
    </div>

    <!-- Script for Mobile Sidebar & Checkbox Fixes -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
            document.body.classList.toggle('overflow-hidden');
        }

        // Add custom checkbox checkmark visibility logic
        document.addEventListener('DOMContentLoaded', () => {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            
            checkboxes.forEach(box => {
                const icon = box.nextElementSibling;
                
                // Init state
                if(box.checked) icon.classList.remove('opacity-0');
                
                // Change listener
                box.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        icon.classList.remove('opacity-0');
                    } else {
                        icon.classList.add('opacity-0');
                    }
                });
            });
        });
    </script>

</body>
</html>
