{# Form fields in a two-column grid. Fields named in `wide` take the full row. #}
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    {% for field in form %}
        <div class="{% if field.name in wide %}sm:col-span-2{% endif %}">
            <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-gray-700 mb-1">{{ field.label }}{% if field.field.required %} <span class="text-rose-500">*</span>{% endif %}</label>
            {{ field }}
            {% if field.help_text %}<p class="text-xs text-gray-400 mt-1">{{ field.help_text }}</p>{% endif %}
            {% for error in field.errors %}<p class="text-xs text-red-600 mt-1">{{ error }}</p>{% endfor %}
        </div>
    {% endfor %}
</div>
