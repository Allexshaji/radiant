<div class="max-w-4xl px-4 py-8 mx-auto">
    {% if can.reports %}<a href="{% url 'report_dashboard' %}" class="inline-block mb-6 text-sm text-blue-600 hover:underline">&larr; Back to Report Dashboard</a>{% endif %}
    
    <div class="p-6 bg-white border border-gray-200 rounded-lg shadow-sm">
        <h2 class="mb-4 text-xl font-bold text-red-600">Pending Daily Reports</h2>
        
        <table class="w-full text-sm text-left text-gray-500">
            <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                <tr>
                    <th class="px-6 py-3">Date</th>
                    <th class="px-6 py-3">Branch</th>
                    <th class="px-6 py-3">Total Revenue</th>
                    <th class="px-6 py-3">Status</th>
                </tr>
            </thead>
            <tbody>
                {% for rep in reports %}
                <tr class="bg-white border-b hover:bg-gray-50">
                    <td class="px-6 py-4 font-medium text-gray-900">{{ rep.report_date|date:"M d, Y" }}</td>
                    <td class="px-6 py-4">{{ rep.branch.name }}</td>
                    <td class="px-6 py-4">₹{{ rep.total_revenue }}</td>
                    <td class="px-6 py-4">
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-800">Pending</span>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="px-6 py-4 text-center text-gray-500">No pending reports found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
